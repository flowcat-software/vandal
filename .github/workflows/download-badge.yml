# Counts release downloads for the README badge.
#
# shields.io's own GitHub downloads badge borrows from a shared pool of donated
# tokens; when the pool runs dry it renders "invalid" or a token error, and
# GitHub's image proxy caches that for up to half an hour. Instead, this sums
# download_count over the installers (*_x64-setup.exe) with our own token and
# draws the badge itself (scripts/download-badge.mjs), on the orphan badges branch:
#   https://raw.githubusercontent.com/flowcat-software/vandal/badges/downloads.svg
# The README shows that file directly. It used to go through shields.io's endpoint
# badge, which showed as a broken image whenever shields.io was slow or down;
# downloads.json (that endpoint file) is still written, as a fallback.
#
# Only installers count: the .sig and SHA256SUMS files are fetched by the
# updater and by people verifying a download, so counting them would count
# one download two or three times.
#
# The branch holds a single commit, replaced on each change, so it doesn't grow.
#
# Actions are pinned to full commit SHAs (the tag is in the comment); Dependabot bumps them.
name: Download badge

on:
  schedule:
    - cron: "41 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].assets[] | select(.name | endswith("_x64-setup.exe")) | .download_count' | awk '{ s += $1 } END { print s + 0 }')
          echo "Total downloads: $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Write and push the badge
        env:
          TOTAL: ${{ steps.count.outputs.total }}
        run: |
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth 1 origin badges
            if [ "$(git show FETCH_HEAD:downloads.json | jq -r .message)" = "$TOTAL" ] \
              && git cat-file -e FETCH_HEAD:downloads.svg 2> /dev/null; then
              echo "Count unchanged."
              exit 0
            fi
          fi
          git worktree add --orphan -b badges-new badges
          cd badges
          jq -n --arg n "$TOTAL" \
            '{schemaVersion: 1, label: "downloads", message: $n, color: "brightgreen"}' > downloads.json
          node ../scripts/download-badge.mjs "$TOTAL" downloads.svg
          cat > README.md <<'EOF'
          # Vandal badges

          Written by `.github/workflows/download-badge.yml` on `main`; don't edit by hand.
          The README shows `downloads.svg`. `downloads.json` is the same count as a
          shields.io endpoint file, kept as a fallback.
          EOF
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Downloads: $TOTAL"
          git push --force origin HEAD:badges
