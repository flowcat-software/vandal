# Builds the Windows installer (PLAN 3C.2), signed for the updater (PLAN 3P.1).
#
# - Push a version tag (v0.3.0-beta.1): run the dependency audit and the checks,
#   build, and create a
#   *draft* GitHub release with the installer, a checksum and the CHANGELOG
#   notes. Richard installs it, then publishes it by hand.
# - Run it by hand (Actions > Release > Run workflow): the same checks and
#   build, with the installer kept as a workflow artifact and no release.
#
# Actions are pinned to full commit SHAs (the tag is in the comment), so a
# moved or hijacked tag can't change what runs with write access (PLAN 3I.3).
# To bump one, resolve the new tag's SHA: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestations: a signed record that this workflow built the installer.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # Known advisories in what we ship block the release (security.yml, PLAN 3I.4).
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build:
    needs: security
    runs-on: windows-latest
    # Holds the updater signing key (PLAN 3P.1); only v* tags and main can use it.
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Pinned so a new stable clippy lint can't fail a release; bump it on purpose.
      - uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0 branch
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the tag matches the version and has notes
        if: env.IS_TAG == 'true'
        run: node scripts/release.mjs check "$TAG"

      - name: Frontend checks
        run: |
          npm run lint
          npm test
          npx tsc --noEmit

      # The Rust crate embeds dist/ at compile time, so build it before clippy.
      - run: npm run build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Signs the installer for the updater (a .sig beside it). Only this step gets
      # the key, and it reuses the dist/ built above instead of running Vite again,
      # so no npm script or bundler ever has the key in its environment
      # (CVE-2023-46115 was a key leaking into a Vite bundle).
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect the installer
        id: installer
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/
          cd out
          sha256sum *-setup.exe *-setup.exe.sig > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Lets anyone check a download came from this repo's workflow:
      # gh attestation verify <installer> --repo rpodsada/vandal
      # Manual runs attest too, so the step is tested before a release needs it.
      - name: Attest the installer's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*-setup.exe

      - name: Keep the installer (manual runs)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vandal-installer
          path: out/
          retention-days: 14

      - name: Create the draft release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$TAG" > release-notes.md
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: replace the files on the existing draft.
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft $prerelease --verify-tag \
              --title "Vandal $TAG" --notes-file release-notes.md
          fi
