# cargo-deny: known advisories and crate sources (PLAN 3I.4).
# Run: npm run security (or cargo deny check advisories sources, from here).

[graph]
# Vandal only ships for Windows. Without this, Linux-only crates under Tauri's
# gtk backend (glib, proc-macro-error) raise advisories for code we never build.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Every ignore needs a reason, and is re-checked when the crate that pulls it in updates.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable: a compile-time macro used by specta, no runtime code (security.md I2)" },
  # zip 4 (tauri-plugin-updater's Windows extraction; fixed in zip 9, which no updater release,
  # 3.0 alphas included, takes yet). The updater only extracts a download whose minisign
  # signature checked out, and ours are bare setup .exe files, never zips. Remove these once
  # the updater moves to zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip: SUID/SGID bits are Unix only; and only signed updates are extracted" },
  { id = "RUSTSEC-2026-0368", reason = "zip: symlinks from an attacker's archive; only zips signed with our key are extracted, and we ship none" },
  { id = "RUSTSEC-2026-0369", reason = "zip: Unix permissions through symlinks; Unix only, and only signed updates are extracted" },
  { id = "RUSTSEC-2026-0429", reason = "zip: a crafted symlink entry aborts extraction (DoS only); only zips signed with our key are extracted, and we ship none" },
]
# Yanked crates (default: warn) don't fail the check; update them once a fix is a week old.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
