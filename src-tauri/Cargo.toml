[package]
name = "vandal"
version = "0.3.0-beta.14"
description = "Fast, free screen capture and markup for Windows"
authors = ["Flowcat Software"]
license = "GPL-3.0-or-later"
repository = "https://github.com/flowcat-software/vandal"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vandal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
tauri-plugin-global-shortcut = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "UI_ViewManagement", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
arboard = "3.6.1"
png = "0.18.1"
tauri-winrt-notification = "0.8"
tauri-plugin-dialog = "2"
# Updates (PLAN 3P). Rust only: no webview gets the updater permission.
tauri-plugin-updater = "2"


# Pixel loops (swizzle, BMP encode) are unusably slow at opt-level 0.
[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
